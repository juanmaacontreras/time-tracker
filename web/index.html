  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("class", "ico");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "2");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  svg.innerHTML = UI_ICONS[name];
  return svg;
}
// Swatch de identidad: ícono de la categoría (o la inicial) sobre el color de la
// actividad. Tenue en las filas; "solid" (fondo lleno) en la tarjeta de lo que corre.
function swatchEl(color, iconKey, name, opts = {}) {
  const el = h("div", { class: "swatch" + (opts.big ? " big" : "") + (opts.solid ? " solid" : ""),
    style: `--c:${color}` });
  const ic = iconKey ? categoryIconEl(iconKey, "currentColor") : null;
  if (ic) { ic.setAttribute("class", "ico"); el.append(ic); }
  else el.append((name || "?").trim().charAt(0).toUpperCase());
  return el;
}

/* ====================== ESTADO DE UI ====================== */
let tab = "timer";
let statsPeriod = "day";
let statsCategory = "all";
let statsOffset = 0;
let catExpanded = null;
let showArchived = false;
const expandedIds = new Set();

/* ====================== RENDER ====================== */
// Se renderizan ambos paneles siempre; en angosto el CSS oculta el inactivo,
// en ancho (desktop) se muestran los dos lado a lado.
function render() { applyProfileChrome(); renderTimer(); renderResumen(); updateTitle(); }

// Aplica el tema (paleta) y el nombre del perfil activo al chrome.
function applyProfileChrome() {
  const pid = Store.currentProfileId();
  const theme = ProfileStore.themeOf(pid);
  const name = ProfileStore.nameOf(pid);
  document.documentElement.dataset.palette = theme;
  document.getElementById("profName").textContent = name;
  document.getElementById("profInitial").textContent = name.trim().charAt(0).toUpperCase();
  document.getElementById("profAvatar").style.background = THEME_ACCENT[theme] || THEME_ACCENT.azul;
  updateTodaySub();
}
// Subtítulo del encabezado: la fecha de hoy y el total acumulado en el día.
function updateTodaySub() {
  const fecha = new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  const total = Store.totalBetween(startOfToday(), Number.MAX_SAFE_INTEGER);
  document.getElementById("todaySub").textContent = total > 0 ? `${fecha} · ${human(total)} hoy` : fecha;
}

// Antes mostraba el cronómetro en vivo (▶ 17:02 · Bovédas de Acero) en el título de la
// pestaña/ventana. Se dejó fijo a pedido: en la ventana instalada como PWA eso se ve
// en la barra de título, y se prefiere que quede en blanco.
function updateTitle() {
  document.title = "Bitácora";
}

const todayEls = {};

function renderTimer() {
  const view = document.getElementById("timerView");
  view.innerHTML = "";
  for (const k in todayEls) delete todayEls[k];

  view.append(buildBanner());

  const runId = Store.runningActId();
  const withArch = Store.activities(true);
  const hasArchived = withArch.some(a => a.archived);
  // Orden por tiempo de hoy, con una sola pasada por el historial.
  const today = Store.secsByActivity(startOfToday());
  const secsToday = a => today[a.id] || 0;
  const byToday = withArch.slice().sort((x, y) => secsToday(y) - secsToday(x));
  const acts = byToday.filter(a => !a.archived);

  const head = h("div", { class: "sechd" }, h("div", { class: "t" }, "Actividades"));
  if (hasArchived) {
    const b = h("button", { class: "textbtn", onclick: () => { showArchived = !showArchived; renderTimer(); } },
      showArchived ? "Ocultar archivadas" : "Ver archivadas");
    head.append(b);
  }
  view.append(head);

  for (const a of acts) view.append(buildRow(a, runId, secsToday(a)));
  if (acts.length === 0 && !hasArchived)
    view.append(h("div", { class: "emptyhint" }, "Todavía no tenés actividades. Creá la primera acá abajo."));
  view.append(h("button", { class: "addcard", onclick: () => openActivitySheet(null) }, icon("plus"), "Nueva actividad"));

  if (showArchived) {
    const arch = byToday.filter(a => a.archived);
    if (arch.length) {
      view.append(h("div", { class: "sechd" }, h("div", { class: "t" }, "Archivadas")));
      for (const a of arch) view.append(buildRow(a, runId, secsToday(a)));
    }
  }
}

// Tarjeta de lo que está corriendo, con el lenguaje de la notificación de la app. Sin
// nada corriendo muestra el total de hoy.
function buildBanner() {
  const runId = Store.runningActId();
  if (!runId) {
    const total = Store.totalBetween(startOfToday(), Number.MAX_SAFE_INTEGER);
    return h("div", { class: "hero" },
      h("div", { class: "eyebrow" }, "Hoy"),
      h("div", { class: "chrono num" }, exact(total)),
      h("div", { class: "hint" }, "Tocá una actividad para empezar a cronometrar."));
  }
  const a = Store.activityById(runId);
  const paused = Store.runningPaused();
  const color = (a && a.color) || "#2F4B8F";
  const cat = a ? Store.categoryForActivity(a) : null;
  const hero = h("div", { class: "hero on" + (paused ? " paused" : ""), style: `--act:${color}` });
  hero.append(h("div", { class: "top" },
    swatchEl(color, cat && cat.icon, a ? a.name : "", { big: true, solid: true }),
    h("div", { class: "meta" },
      h("div", { class: "eyebrow" }, h("span", { class: "pulse" }), paused ? "Pausado" : "Grabando"),
      h("div", { class: "nm" }, a ? a.name : "—"),
      cat ? h("div", { class: "cat" }, cat.name) : null)));
  hero.append(h("div", { class: "chrono num", id: "bannerChrono" }, exact(Math.floor(Store.runningElapsedMs() / 1000))));
  hero.append(h("div", { class: "actions" },
    h("button", { class: "btn primary", onclick: () => { Store.runningPaused() ? Store.resume() : Store.pause(); afterMutation(); } },
      icon(paused ? "play" : "pause"), paused ? "Seguir" : "Pausar"),
    h("button", { class: "btn tonal", onclick: () => { Store.stop(); afterMutation(); } }, icon("stop"), "Parar")));
  return hero;
}

function buildRow(act, runId, todaySecs) {
  const running = act.id === runId;
  const paused = running && Store.runningPaused();
  const expanded = expandedIds.has(act.id);
  const archived = !!act.archived;
  const cat = Store.categoryForActivity(act);
  const color = act.color || "#2F4B8F";

  const cont = h("div", { class: "rowc" + (paused ? " paused" : running ? " running" : "") + (archived ? " arch" : "") });
  const row = h("div", { class: "row" });
  row.append(swatchEl(color, cat.icon, act.name));
  row.append(h("div", { class: "mid" },
    h("div", { class: "name" }, act.name),
    h("div", { class: "type" }, archived ? `${cat.name} · Archivada` : cat.name)));

  const todayEl = h("div", { class: "today num" + (todaySecs || running ? "" : " zero") }, exact(todaySecs));
  todayEls[act.id] = todayEl;
  row.append(todayEl);
  row.append(h("div", { class: "playbtn", title: running ? "Parar" : "Empezar" }, icon(running ? "stop" : "play")));
  row.append(h("div", { class: "expbtn" + (expanded ? " open" : ""), title: "Entradas de hoy",
    onclick: (e) => {
      e.stopPropagation();
      expanded ? expandedIds.delete(act.id) : expandedIds.add(act.id);
      renderTimer();
    } }, icon("chevDown")));

  // click en la fila = arrancar/parar (o editar si está archivada)
  row.addEventListener("click", () => {
    if (archived) { openActivitySheet(act); return; }
    Store.toggle(act.id); afterMutation();
  });
  // mantener presionado / click derecho = editar
  attachLongPress(row, () => openActivitySheet(act));
  row.addEventListener("contextmenu", (e) => { e.preventDefault(); openActivitySheet(act); });

  cont.append(row);
  if (expanded) cont.append(buildSessionsPanel(act));
  return cont;
}

function attachLongPress(el, cb) {
  let timer = null;
  const start = () => { timer = setTimeout(() => { timer = null; cb(); }, 500); };
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener("touchstart", start, { passive: true });
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchmove", cancel);
}

function buildSessionsPanel(act) {
  const panel = h("div", { class: "panel" }, h("div", { class: "ptitle" }, "Entradas de hoy"));
  const sessions = Store.sessionsForActivityToday(act.id);
  if (sessions.length === 0) {
    panel.append(h("div", { class: "pempty" }, "Sin entradas cerradas todavía."));
    return panel;
  }
  for (const s of sessions) {
    const secs = Math.floor((s.end - s.start) / 1000);
    panel.append(h("div", { class: "srow" },
      h("div", { class: "slabel num" }, `${hhmm(s.start)} – ${hhmm(s.end)}`),
      h("div", { class: "sdur num" }, exact(secs)),
      h("div", { class: "sdel", title: "Borrar",
        onclick: () => confirmDialog("Borrar entrada",
          `Se borra el registro de ${hhmm(s.start)} a ${hhmm(s.end)}. ¿Seguro?`,
          "Borrar", true, () => { Store.deleteSession(s.id); afterMutation(); }) }, icon("x"))));
  }
  return panel;
}

/* ---------------- RESUMEN ---------------- */
function renderResumen() {
  const view = document.getElementById("resumenView");
  view.innerHTML = "";
  view.append(buildPeriodSelector());

  const [from, to] = periodRange(statsPeriod, statsOffset);
  view.append(buildOffsetNav(periodLabel(statsPeriod, statsOffset, from, to)));

  const allActs = Store.activities(true);
  const catMap = new Map();
  for (const a of allActs) { const c = Store.categoryForActivity(a); catMap.set(c.id, c); }
  const allCats = [...catMap.values()].sort((x, y) => x.name.localeCompare(y.name));
  if (allCats.length > 1) view.append(buildCategorySelector(allCats));
  if (statsCategory !== "all" && !allCats.some(c => c.id === statsCategory)) statsCategory = "all";

  const acts = statsCategory === "all" ? allActs
    : allActs.filter(a => Store.categoryForActivity(a).id === statsCategory);

  // Una sola pasada por el historial para todo el período; el resto sale de acá.
  const secs = Store.secsByActivity(from, to);
  const perAct = acts.map(a => [a, secs[a.id] || 0])
    .filter(x => x[1] > 0).sort((x, y) => y[1] - x[1]);
  const total = perAct.reduce((s, x) => s + x[1], 0);

  const statsCatName = statsCategory === "all" ? "" : (catMap.get(statsCategory)?.name || statsCategory);
  const card = h("div", { class: "card statcard" },
    h("div", { class: "lbl" }, statsCategory === "all" ? "Total" : "Total · " + statsCatName),
    h("div", { class: "total num" }, exact(total)));
  view.append(card);

  if (perAct.length === 0) {
    card.append(h("div", { class: "empty" }, "Sin registros en este período."));
    return;
  }
  card.append(h("div", { class: "sub" }, perAct.length === 1 ? "en 1 actividad" : `en ${perAct.length} actividades`));

  const actIds = new Set(acts.map(a => a.id));
  const catColorsAll = categoryColors(allActs);
  // Día → por actividad. Mes → por día. Semana → por día TAMBIÉN, pero cada barra
  // apilada por categoría (así se ve en qué día se le dedicó tiempo a qué). Si ya hay
  // un filtro de categoría activo, apilar una sola categoría no aporta nada: cae a
  // "por actividad" como día.
  if (statsPeriod === "week" && statsCategory === "all") {
    // Orden fijo de categorías (por total de la semana) para que el mismo color quede
    // siempre en la misma posición dentro de cada barra apilada.
    const catOrder = Object.entries(categorySums(allActs, secs)).sort((x, y) => y[1] - x[1]).map(x => x[0]);
    card.append(buildStackedBarChart(weekCategoryStacks(allActs, from, catOrder), catColorsAll, todayIndex(from, 7)));
  } else if (statsPeriod === "day" || statsPeriod === "week") {
    const bars = perAct.slice(0, 8).map(x => ({ label: x[0].name, secs: x[1], color: x[0].color || "#2F4B8F" }));
    card.append(buildBarChart(bars, true, 1, -1));
  } else {
    const bars = monthBars(actIds, from, statsOffset === 0 ? new Date().getDate() : daysInMonth(from));
    card.append(buildBarChart(bars, false, 5, todayIndex(from, bars.length)));
  }

  view.append(h("div", { class: "sechd" }, h("div", { class: "t" }, "Por actividad")));
  const list = h("div", { class: "card list" });
  for (const [a, sec] of perAct) list.append(statRow(a.name, a.color || "#2F4B8F", sec, total, null));
  view.append(list);

  if (statsCategory === "all") {
    const entries = Object.entries(categorySums(allActs, secs)).sort((x, y) => y[1] - x[1]);
    if (entries.length) {
      const expanded = catExpanded == null ? entries.length <= 3 : catExpanded;
      const chev = icon("chevDown");
      if (!expanded) chev.style.transform = "rotate(-90deg)";
      view.append(h("div", { class: "sechd" },
        h("div", { class: "t click", onclick: () => { catExpanded = !expanded; renderResumen(); } }, "Por categoría", chev)));
      // Mismo color que en el gráfico apilado: sirve de leyenda.
      if (expanded) {
        const cl = h("div", { class: "card list" });
        for (const [c, sec] of entries) {
          const label = (Store.categoryById(c) || {}).name || "General";
          cl.append(statRow(label, catColorsAll[c] || "var(--indigo)", sec, total, () => { statsCategory = c; renderResumen(); }));
        }
        view.append(cl);
      }
    }
  }

  view.append(h("button", { class: "csvbtn", onclick: onExportClick }, icon("download"), "Exportar"));
}

// Posición de "hoy" dentro de un período que arranca en from (para resaltar su barra),
// o -1 si hoy no cae ahí.
function todayIndex(from, count) {
  const i = Math.round((startOfToday() - from) / DAY_MS);
  return i >= 0 && i < count ? i : -1;
}

function buildPeriodSelector() {
  const seg = h("div", { class: "seg" });
  for (const [p, lbl] of [["day", "Día"], ["week", "Semana"], ["month", "Mes"]])
    seg.append(h("div", { class: "s" + (p === statsPeriod ? " active" : ""),
      onclick: () => { statsPeriod = p; statsOffset = 0; renderResumen(); } }, lbl));
  return seg;
}
function buildOffsetNav(label) {
  const nav = h("div", { class: "nav" });
  nav.append(h("div", { class: "ar", title: "Anterior", onclick: () => { statsOffset -= 1; renderResumen(); } }, icon("chevLeft")));
  nav.append(h("div", { class: "navlbl" }, label));
  const canFwd = statsOffset < 0;
  nav.append(h("div", { class: "ar" + (canFwd ? "" : " off"), title: "Siguiente",
    onclick: canFwd ? () => { statsOffset += 1; renderResumen(); } : null }, icon("chevRight")));
  return nav;
}
// Color de cada categoría: propiedad propia de la categoría (ya no "la de su primera
// actividad"). Es la "leyenda" consistente entre el selector, el gráfico apilado y la
// lista colapsable.
function categoryColors(acts) {
  const map = {};
  for (const a of acts) {
    const cat = Store.categoryForActivity(a);
    if (!(cat.id in map)) map[cat.id] = cat.color || "#2F4B8F";
  }
  return map;
}
function buildCategorySelector(cats) {
  const rowEl = h("div", { class: "catrow" });
  const chip = (label, value, color) => {
    const c = h("div", { class: "chip" + (value === statsCategory ? " active" : ""),
      onclick: () => { statsCategory = value; renderResumen(); } });
    if (color) c.append(h("div", { class: "cdot", style: "background:" + color }));
    c.append(document.createTextNode(label));
    return c;
  };
  rowEl.append(chip("Todo", "all", null));
  for (const c of cats) rowEl.append(chip(c.name, c.id, c.color || "#2F4B8F"));
  return rowEl;
}
// Segundos por categoría, a partir de los segundos por actividad ya calculados.
function categorySums(acts, secs) {
  const sums = {};
  for (const a of acts) {
    const t = secs[a.id] || 0;
    if (t > 0) { const c = Store.categoryForActivity(a).id; sums[c] = (sums[c] || 0) + t; }
  }
  return sums;
}
function monthBars(actIds, monthStart, dayCount) {
  const out = [];
  for (let i = 0; i < dayCount; i++) {
    const ds = monthStart + i * DAY_MS;
    out.push({ label: String(i + 1), secs: Store.totalBetween(ds, ds + DAY_MS, actIds), color: "var(--indigo)" });
  }
  return out;
}
// Para cada día de la semana, el desglose por categoría (en el orden fijo catOrder, así
// el mismo color queda siempre en la misma posición dentro de cada barra apilada).
function weekCategoryStacks(acts, weekStart, catOrder) {
  const labels = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
  return labels.map((lb, i) => {
    const ds = weekStart + i * DAY_MS;
    const perCat = categorySums(acts, Store.secsByActivity(ds, ds + DAY_MS));
    const segs = catOrder.filter(c => perCat[c] > 0).map(c => ({ cat: c, secs: perCat[c] }));
    return { label: lb, total: segs.reduce((s, x) => s + x.secs, 0), segs };
  });
}
// Barras apiladas: una columna por día, cada una dividida en segmentos de color según
// la categoría (mismo color que el selector y la lista colapsable de categorías).
function buildStackedBarChart(days, catColors, todayIdx) {
  const max = Math.max(1, ...days.map(d => d.total));
  const chart = h("div", { class: "chart" });
  days.forEach((d, i) => {
    const col = h("div", { class: "cbar" });
    col.append(h("div", { class: "cval num" }, d.total > 0 ? human(d.total) : ""));
    const track = h("div", { class: "ctrack" });
    if (d.total > 0) {
      const stack = h("div", { class: "cstack", style: `height:${Math.max(3, (d.total / max) * 100)}%` });
      for (const seg of d.segs)
        stack.append(h("div", { class: "cseg", style: `flex-grow:${seg.secs};background:${catColors[seg.cat] || "var(--indigo)"}` }));
      track.append(stack);
    }
    col.append(track);
    col.append(h("div", { class: "clab" + (i === todayIdx ? " today" : "") }, d.label));
    chart.append(col);
  });
  return chart;
}
function buildBarChart(bars, showValues, labelStep, todayIdx) {
  const max = Math.max(1, ...bars.map(b => b.secs));
  const chart = h("div", { class: "chart" + (bars.length > 12 ? " dense" : "") });
  bars.forEach((b, idx) => {
    const col = h("div", { class: "cbar" });
    if (showValues) col.append(h("div", { class: "cval num" }, b.secs > 0 ? human(b.secs) : ""));
    const track = h("div", { class: "ctrack" });
    if (b.secs > 0) track.append(h("div", { class: "cfill", style: `height:${Math.max(3, (b.secs / max) * 100)}%;background:${b.color}` }));
    col.append(track);
    const showLabel = idx % labelStep === 0 || idx === todayIdx;
    col.append(h("div", { class: "clab" + (idx === todayIdx ? " today" : "") }, showLabel ? b.label : ""));
    chart.append(col);
  });
  return chart;
}
function statRow(name, color, sec, total, onClick) {
  const pct = total > 0 ? Math.round(sec * 100 / total) : 0;
  const box = h("div", { class: "stat" + (onClick ? " click" : "") });
  if (onClick) box.addEventListener("click", onClick);
  box.append(h("div", { class: "top" },
    h("div", { class: "sdot", style: "background:" + color }),
    h("div", { class: "snm" }, name),
    h("div", { class: "sval num" }, exact(sec)),
    h("div", { class: "spct num" }, pct + "%")));
  const track = h("div", { class: "track" });
  track.append(h("div", { class: "fill", style: `width:${total > 0 ? (sec / total * 100) : 0}%;background:${color}` }));
  box.append(track);
  return box;
}

/* ====================== DIÁLOGOS ====================== */
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
function showModal(node, mandatory) {
  const root = document.getElementById("modalRoot");
  root.innerHTML = "";
  const overlay = h("div", { class: "overlay", onclick: (e) => { if (!mandatory && e.target === overlay) closeModal(); } }, node);
  root.append(overlay);
}
function confirmDialog(title, msg, okLabel, danger, onOk) {
  const d = h("div", { class: "dialog" },
    h("h3", null, title),
    h("p", null, msg),
    h("div", { class: "dbtns" },
      h("button", { class: "dbtn ghost", onclick: closeModal }, "Cancelar"),
      h("button", { class: "dbtn" + (danger ? " danger" : ""), onclick: () => { closeModal(); onOk(); } }, okLabel)));
  showModal(d);
}

function openActivitySheet(existing) {
  const nameIn = h("input", { class: "field", placeholder: "Nombre (ej. Análisis de circuitos)", value: existing ? existing.name : "" });

  // Si todavía no hay ninguna categoría (perfil nuevo, o se borró la única que había),
  // el selector queda vacío con "+ Nueva" — nada de sembrar una "General" automática:
  // eso hacía que borrar la única categoría pareciera "recrearse sola".
  let selectedCatId = existing ? Store.categoryForActivity(existing).id : (Store.categories()[0]?.id || "");

  const catLabel = h("div", { class: "flabel" }, "Categoría");
  const catRow = h("div", { class: "catpick" });
  function rebuildCatRow() {
    catRow.innerHTML = "";
    for (const cat of Store.categories()) {
      const active = cat.id === selectedCatId;
      const chip = h("div", { class: "catchip" + (active ? " active" : ""),
        onclick: () => { selectedCatId = cat.id; rebuildCatRow(); } });
      const iconEl = cat.icon ? categoryIconEl(cat.icon, active ? "var(--paper)" : (cat.color || "#2F4B8F")) : null;
      if (iconEl) { iconEl.setAttribute("class", "cicon"); chip.append(iconEl); }
      else chip.append(h("div", { class: "cdot", style: "background:" + (cat.color || "#2F4B8F") }));
      chip.append(document.createTextNode(cat.name));
      chip.addEventListener("contextmenu", (e) => { e.preventDefault(); openCategorySheet(cat, (id) => { selectedCatId = id; rebuildCatRow(); }); });
      attachLongPress(chip, () => openCategorySheet(cat, (id) => { selectedCatId = id; rebuildCatRow(); }));
      catRow.append(chip);
    }
    const add = h("div", { class: "catchip addnew",
      onclick: () => openCategorySheet(null, (id) => { selectedCatId = id; rebuildCatRow(); }) }, "+ Nueva");
    catRow.append(add);
  }
  rebuildCatRow();
  const catHint = h("div", { class: "cathint" }, "Mantené presionada (o click derecho) una categoría para editarla.");

  let picked = existing ? existing.color : COLORS[Store.activities().length % COLORS.length];
  const swWrap = h("div", { class: "swatches" });
  const swatchEls = [];
  COLORS.forEach(c => {
    const sw = h("div", { class: "sw" + (c === picked ? " sel" : ""), style: "background:" + c,
      onclick: () => { picked = c; swatchEls.forEach((e, i) => e.className = "sw" + (COLORS[i] === picked ? " sel" : "")); } });
    swatchEls.push(sw); swWrap.append(sw);
  });

  const d = h("div", { class: "dialog" },
    h("h3", null, existing ? "Editar actividad" : "Nueva actividad"),
    nameIn,
    catLabel, catRow, catHint,
    h("div", { class: "flabel" }, "Color"), swWrap);

  if (existing) {
    const archived = !!existing.archived;
    d.append(h("button", { class: "linkbtn", onclick: () => {
      archived ? Store.unarchiveActivity(existing.id) : Store.archiveActivity(existing.id);
      closeModal(); afterMutation();
    } }, icon("archive"), archived ? "Desarchivar actividad" : "Archivar actividad"));
  }

  const btns = h("div", { class: "dbtns" });
  if (existing) {
    btns.append(h("button", { class: "dbtn dangertext", style: "margin-right:auto", onclick: () => {
      confirmDialog(`Borrar "${existing.name}"`, "También se borran sus sesiones. ¿Seguro?",
        "Borrar", true, () => { Store.deleteActivity(existing.id); afterMutation(); });
    } }, "Borrar"));
  }
  btns.append(h("button", { class: "dbtn ghost", onclick: closeModal }, "Cancelar"));
  btns.append(h("button", { class: "dbtn", onclick: () => {
    const name = nameIn.value.trim();
    if (!name) return;
    if (existing) Store.updateActivity(existing.id, name, selectedCatId, picked);
    else Store.addActivity(name, selectedCatId, picked);
    closeModal(); afterMutation();
  } }, "Guardar"));
  d.append(btns);

  showModal(d);
  setTimeout(() => nameIn.focus(), 30);
}

// Alta/edición de una categoría (nombre + ícono + color). onDone recibe el id que el
// selector de openActivitySheet debe dejar seleccionado al volver (espejo de
// MainActivity.openCategorySheet).
//
// Ojo: esto se abre DESDE ADENTRO de openActivitySheet. showModal()/closeModal()
// comparten un solo #modalRoot (no apilan diálogos como los AlertDialog de Android),
// así que si usáramos esas mismas funciones acá, abrir "Nueva categoría" borraría del
// DOM el diálogo de "Nueva actividad" que lo abrió. Por eso este diálogo se monta en su
// propia capa (appendeada directo a <body>, no a #modalRoot) y no toca el diálogo padre.
function openCategorySheet(existing, onDone) {
  const layer = h("div", { class: "overlay" });
  const closeLayer = () => layer.remove();
  layer.addEventListener("click", (e) => { if (e.target === layer) closeLayer(); });
  document.body.append(layer);

  const nameIn = h("input", { class: "field", placeholder: "Nombre (ej. Materia, Libro, Proyecto…)",
    value: existing ? existing.name : "" });

  let pickedIcon = existing ? (existing.icon || "") : "";
  const iconRow = h("div", { class: "iconpick" });
  function rebuildIconRow() {
    iconRow.innerHTML = "";
    const noneBtn = h("div", { class: "icb" + (pickedIcon === "" ? " sel" : ""),
      onclick: () => { pickedIcon = ""; rebuildIconRow(); } }, "Aa");
    iconRow.append(noneBtn);
    for (const key of CATEGORY_ICON_ORDER) {
      const btn = h("div", { class: "icb" + (pickedIcon === key ? " sel" : ""),
        onclick: () => { pickedIcon = key; rebuildIconRow(); } });
      btn.append(categoryIconEl(key, "currentColor"));
      iconRow.append(btn);
    }
  }
  rebuildIconRow();

  let pickedColor = existing ? existing.color : COLORS[Store.categories().length % COLORS.length];
  const swWrap = h("div", { class: "swatches" });
  const swatchEls = [];
  COLORS.forEach(c => {
    const sw = h("div", { class: "sw" + (c === pickedColor ? " sel" : ""), style: "background:" + c,
      onclick: () => { pickedColor = c; swatchEls.forEach((e, i) => e.className = "sw" + (COLORS[i] === pickedColor ? " sel" : "")); } });
    swatchEls.push(sw); swWrap.append(sw);
  });

  const d2 = h("div", { class: "dialog" },
    h("h3", null, existing ? "Editar categoría" : "Nueva categoría"),
    nameIn,
    h("div", { class: "flabel" }, "Ícono"), iconRow,
    h("div", { class: "flabel" }, "Color"), swWrap);

  const btns2 = h("div", { class: "dbtns" });
  if (existing) {
    btns2.append(h("button", { class: "dbtn dangertext", style: "margin-right:auto", onclick: () => {
      if (!confirm(`Borrar categoría "${existing.name}"? Las actividades que la usan quedan sin categoría (General).`)) return;
      Store.deleteCategory(existing.id);
      // "" = sin categoría (cae al "General" virtual de categoryForActivity) en vez de
      // forzar la creación de una categoría real de reemplazo.
      const fallback = Store.categories()[0]?.id || "";
      closeLayer();
      onDone(fallback);
    } }, "Borrar"));
  }
  btns2.append(h("button", { class: "dbtn ghost", onclick: closeLayer }, "Cancelar"));
  btns2.append(h("button", { class: "dbtn", onclick: () => {
    const name = nameIn.value.trim() || "General";
    let id;
    if (existing) { Store.updateCategory(existing.id, name, pickedIcon, pickedColor); id = existing.id; }
    else { id = Store.addCategory(name, pickedIcon, pickedColor); }
    closeLayer();
    onDone(id);
  } }, "Guardar"));
  d2.append(btns2);

  layer.append(d2);
  setTimeout(() => nameIn.focus(), 30);
}

function onExportClick() {
  const [from, to] = periodRange(statsPeriod, statsOffset);
  const periodTxt = periodLabel(statsPeriod, statsOffset, from, to);
  const catName = statsCategory === "all" ? "" : (Store.categoryById(statsCategory)?.name || statsCategory);
  const filterLbl = statsCategory === "all" ? periodTxt : `${periodTxt} · ${catName}`;
  const choice = (ico, title, sub, fn) => h("button", { class: "dchoice", onclick: () => { closeModal(); fn(); } },
    icon(ico), h("div", null, title, h("small", null, sub)));
  const d = h("div", { class: "dialog" },
    h("h3", null, "Exportar"),
    choice("table", "Historial completo", "Todas las sesiones, en CSV", () => doExport(false)),
    choice("filter", "Solo lo filtrado", `${filterLbl}, en CSV`, () => doExport(true)),
    choice("save", "Backup completo", "Todos los datos, en JSON", doBackup),
    h("div", { class: "dbtns" }, h("button", { class: "dbtn ghost", onclick: closeModal }, "Cancelar")));
  showModal(d);
}
// Backup crudo y completo, para poder volver atrás si algo corrompe los datos. El CSV
// no sirve para eso: exporta sesiones de un período, no el estado entero.
function doBackup() {
  const json = JSON.stringify(Store.fullBackup(), null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const fecha = new Date().toISOString().slice(0, 10);
  const a = document.createElement("a");
  // Nombre con fecha para que dos backups no se pisen entre sí.
  a.href = url; a.download = `bitacora-backup-${fecha}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function doExport(filtered) {
  let csv;
  if (filtered) {
    const [from, to] = periodRange(statsPeriod, statsOffset);
    const ids = statsCategory === "all" ? null
      : new Set(Store.activities(true).filter(a => Store.categoryForActivity(a).id === statsCategory).map(a => a.id));
    csv = Store.exportCsv(from, to, ids);
  } else csv = Store.exportCsv();
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "bitacora.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ====================== PERFILES ====================== */
function profileRowNode(p, current) {
  const isCur = p.id === current;
  const row = h("div", { class: "prow" + (isCur ? " cur" : "") });
  row.append(h("div", { class: "avatar", style: "background:" + (THEME_ACCENT[p.theme] || THEME_ACCENT.azul) },
    p.name.trim().charAt(0).toUpperCase()));
  row.append(h("div", { class: "pn" }, p.name));
  if (isCur) row.append(h("div", { class: "pcheck" }, icon("check")));
  row.append(h("div", { class: "pedit", title: "Editar",
    onclick: (e) => { e.stopPropagation(); openProfileEdit(p); } }, icon("edit")));
  row.addEventListener("click", () => selectProfile(p.id));
  return row;
}

function openProfileSheet() {
  const d = h("div", { class: "dialog" }, h("h3", null, "Perfiles"));
  const cur = Store.currentProfileId();
  for (const p of ProfileStore.profiles()) d.append(profileRowNode(p, cur));
  d.append(h("button", { class: "addcard", onclick: openNewProfile }, icon("plus"), "Nuevo perfil"));
  d.append(h("div", { class: "dbtns" }, h("button", { class: "dbtn ghost", onclick: closeModal }, "Cerrar")));
  showModal(d);
}

function showMandatoryPicker() {
  const d = h("div", { class: "dialog" }, h("h3", null, "¿Quién sos?"));
  for (const p of ProfileStore.profiles()) d.append(profileRowNode(p, ""));
  d.append(h("button", { class: "addcard", onclick: openNewProfile }, icon("plus"), "Nuevo perfil"));
  showModal(d, true);
}

// Llegó algo nuevo (sync remoto u otra pestaña). Si fue el borrado del perfil en el que
// está parada esta pestaña, se pasa al Principal en vez de seguir usando uno que ya no
// figura en ningún lado. Espejo de MainActivity.onRemoteChange.
function onRemoteChange() {
  if (!Store.hasChosenProfile()) return;
  const cur = Store.currentProfileId();
  if (cur !== "default" && ProfileStore.isDeleted(cur)) selectProfile("default");
  else render();
}

function selectProfile(id) {
  if (id === Store.currentProfileId() && Store.hasChosenProfile()) { closeModal(); return; }
  Store.setCurrentProfile(id);
  statsOffset = 0; statsCategory = "all"; catExpanded = null; expandedIds.clear(); showArchived = false;
  closeModal();
  applyProfileChrome();
  render();
  sync();
}

function openNewProfile() {
  const nameIn = h("input", { class: "field", placeholder: "Nombre del perfil (ej. María)" });
  const d = h("div", { class: "dialog" },
    h("h3", null, "Nuevo perfil"), nameIn,
    h("div", { class: "dbtns" },
      h("button", { class: "dbtn ghost", onclick: openProfileSheet }, "Cancelar"),
      h("button", { class: "dbtn", onclick: () => {
        const name = nameIn.value.trim(); if (!name) return;
        const id = ProfileStore.add(name, ProfileStore.DEFAULT_THEME);
        selectProfile(id);
      } }, "Crear")));
  showModal(d);
  setTimeout(() => nameIn.focus(), 30);
}

function openProfileEdit(p) {
  const nameIn = h("input", { class: "field", value: p.name });
  let pickedTheme = THEME_ORDER.includes(p.theme) ? p.theme : "azul";
  const swWrap = h("div", { class: "swatches" });
  const els = [];
  THEME_ORDER.forEach(t => {
    const sw = h("div", { class: "sw" + (t === pickedTheme ? " sel" : ""), style: "background:" + THEME_ACCENT[t],
      onclick: () => { pickedTheme = t; els.forEach((e, i) => e.className = "sw" + (THEME_ORDER[i] === pickedTheme ? " sel" : "")); } });
    els.push(sw); swWrap.append(sw);
  });
  const d = h("div", { class: "dialog" },
    h("h3", null, "Editar perfil"), nameIn,
    h("div", { class: "flabel" }, "Tema"), swWrap);
  const btns = h("div", { class: "dbtns" });
  if (p.id !== "default")
    btns.append(h("button", { class: "dbtn dangertext", style: "margin-right:auto", onclick: () => confirmDeleteProfile(p) }, "Borrar"));
  btns.append(h("button", { class: "dbtn ghost", onclick: openProfileSheet }, "Cancelar"));
  btns.append(h("button", { class: "dbtn", onclick: () => {
    const name = nameIn.value.trim(); if (name) ProfileStore.rename(p.id, name);
    ProfileStore.setTheme(p.id, pickedTheme);
    closeModal();
    applyProfileChrome(); render(); sync();
  } }, "Guardar"));
  d.append(btns);
  showModal(d);
}

function confirmDeleteProfile(p) {
  const input = h("input", { class: "field", placeholder: "escribí borrar" });
  const d = h("div", { class: "dialog" },
    h("h3", null, "Borrar perfil"),
    h("p", null, `Se borra el perfil "${p.name}" y TODAS sus actividades e historial. Esto no se puede deshacer. Para confirmar, escribí la palabra borrar:`),
    input,
    h("div", { class: "dbtns" },
      h("button", { class: "dbtn ghost", onclick: openProfileSheet }, "Cancelar"),
      h("button", { class: "dbtn danger", onclick: () => {
        if (input.value.trim().toLowerCase() !== "borrar") { input.classList.add("bad"); input.focus(); return; }
        const wasCurrent = Store.currentProfileId() === p.id;
        ProfileStore.del(p.id);
        sync();
        if (wasCurrent) selectProfile("default");
        else { closeModal(); openProfileSheet(); }
      } }, "Borrar")));
  showModal(d);
  setTimeout(() => input.focus(), 30);
}

document.getElementById("profileBtn").onclick = openProfileSheet;

/* ====================== MUTACIONES / LOOP ====================== */
let pushTimer = null;
function afterMutation() {
  render();
  // sube el cambio local enseguida; el pull+merge periódico trae lo de otros dispositivos.
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => sync(true), 250);
}

/* Tab switching */
function switchTab(t) {
  tab = t;
  document.body.dataset.tab = t;  // el CSS decide qué panel mostrar en angosto
  document.getElementById("tabTimer").classList.toggle("active", t === "timer");
  document.getElementById("tabResumen").classList.toggle("active", t === "resumen");
  render();
}
document.getElementById("tabTimer").onclick = () => switchTab("timer");
document.getElementById("tabResumen").onclick = () => switchTab("resumen");

/* Theme toggle */
function initTheme() {
  const saved = localStorage.getItem("theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  applyTitlebarColor();
}
// Mantiene la barra de título de la ventana instalada (Chrome/Edge) en el mismo tono
// que el fondo de la app, en vez de quedar fija en el indigo del ícono. Un solo <meta
// name="theme-color"> actualizado por JS, en vez de variantes con
// prefers-color-scheme: así respeta también el toggle manual claro/oscuro de acá
// adentro, no solo la preferencia del sistema.
// También pinta el botón de tema: luna en claro (pasar a oscuro), sol en oscuro.
function applyTitlebarColor() {
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.getElementById("themeColorMeta").setAttribute("content", isDark ? "#2E3440" : "#ECEFF4");
  const btn = document.getElementById("themeBtn");
  btn.innerHTML = "";
  btn.append(icon(isDark ? "sun" : "moon"));
}
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  applyTitlebarColor();
};

/* Ticker: refresca el tiempo en vivo sin re-renderizar toda la lista.
   No depende de la pestaña: en desktop el panel del cronómetro siempre está visible. */
setInterval(() => {
  const runId = Store.runningActId();
  if (runId && !Store.runningPaused()) {
    const t = exact(Store.secsFor(runId, startOfToday()));
    if (todayEls[runId]) todayEls[runId].textContent = t;
    const bc = document.getElementById("bannerChrono");
    if (bc) bc.textContent = exact(Math.floor(Store.runningElapsedMs() / 1000));
    updateTodaySub();
  }
  updateTitle();
}, 1000);

/* Sync loop + eventos.
   Con Live conectado los cambios llegan al instante y el sondeo queda como respaldo
   (60 s). Sin Live (Realtime apagado en la tabla, sin WebSocket o conexión caída) el
   sondeo es la única forma de enterarse y vuelve a 10 s. OJO: ese 10 s no se puede
   alargar — ya se probó a 60 s sin un canal en vivo y la web tardaba hasta un minuto
   en reflejar cambios del celular. Se evalúa cada 10 s, así al caerse Live el ritmo
   rápido vuelve solo.

   Sondear es barato: son GET, y leer no dispara el trigger de Postgres. Lo que había
   que evitar eran las ESCRITURAS innecesarias, y de eso se encarga syncBucket: solo
   sube si el remoto quedó atrás (isBehind). */
setInterval(() => {
  if (Date.now() - lastSyncAt >= (Live.ok ? 60000 : 10000) - 500) sync();
}, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
window.addEventListener("focus", () => sync());
// Otra pestaña (o la ventana instalada) escribió en localStorage: el cache en memoria de
// esta quedó viejo, y la próxima escritura de acá pisaría lo que hizo la otra.
window.addEventListener("storage", () => {
  Store._root = null; Store._rootProfile = null; ProfileStore._index = null;
  onRemoteChange();
});

/* ====================== ARRANQUE ====================== */
initTheme();
document.body.dataset.tab = tab;
if (Store.hasChosenProfile()) {
  // Recién acá se aplica nombre/tema: si no, se filtraría el perfil de fallback
  // (el que quedó guardado como "default") antes de que el usuario confirme nada.
  applyProfileChrome();
  render();
} else {
  // Primera vez: elegir perfil. Traemos el índice remoto por si hay perfiles de otro dispositivo.
  showMandatoryPicker();
  syncIndex().catch(() => {}).then(() => { if (!Store.hasChosenProfile()) showMandatoryPicker(); });
}
sync();

/* ====================== PWA: instalación y actualizaciones ==================
   Solo corre servida por HTTPS; desde file:// no hay service worker y todo esto
   se saltea sin romper nada.

   El punto delicado es el estado "waiting". Cuando el navegador encuentra un sw.js
   distinto, lo instala en segundo plano pero NO lo activa: se queda esperando a que
   se cierren todas las pestañas de la app. Como esta web se usa siempre abierta, sin
   manejarlo explícitamente te podés quedar semanas con la versión vieja sintiendo que
   "no se actualiza". Por eso acá se detecta ese estado, se le pregunta al usuario, y
   al aceptar se le ordena activarse y se recarga. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  let recargando = false;
  // Cuando el service worker nuevo toma el control, la página se recarga una sola vez.
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (recargando) return;
    recargando = true;
    location.reload();
  });

  const ofrecerActualizacion = (esperando) => {
    confirmDialog(
      "Hay una versión nueva",
      "Ya está descargada. Actualizar recarga la app; no se pierde nada de lo que tengas registrado.",
      "Actualizar", false,
      () => esperando.postMessage("SKIP_WAITING")
    );
  };

  navigator.serviceWorker.register("sw.js").then((reg) => {
    // Caso 1: al abrir ya había una versión esperando de una visita anterior.
    if (reg.waiting && navigator.serviceWorker.controller) ofrecerActualizacion(reg.waiting);

    // Caso 2: aparece una versión nueva con la app abierta.
    reg.addEventListener("updatefound", () => {
      const nuevo = reg.installing;
      if (!nuevo) return;
      nuevo.addEventListener("statechange", () => {
        // controller existe solo si YA había un service worker activo: sin eso, este
        // "installed" es la primera instalación y no hay nada que avisar.
        if (nuevo.state === "installed" && navigator.serviceWorker.controller) {
          ofrecerActualizacion(nuevo);
        }
      });
    });

    // El navegador chequea solo cada tanto, pero una pestaña que queda abierta días
    // puede tardar en enterarse. Un chequeo por hora es barato (una request a sw.js).
    setInterval(() => reg.update().catch(() => {}), 3600000);
  }).catch(() => { /* sin service worker la app funciona igual, solo no es instalable */ });
}
</script>
