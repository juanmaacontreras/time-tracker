<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bitácora</title>
<!-- PWA: permite instalarla como aplicación (ventana propia, ícono, sin barra del
     navegador). Solo tiene efecto servida por HTTPS — desde file:// se ignora. -->
<link rel="manifest" href="manifest.json" />
<!-- Color de la barra de título de la ventana instalada (Chrome/Edge la pintan con
     esto). Arranca en el tono oscuro y se corrige por JS según el tema real ni bien
     carga la página — ver applyTitlebarColor más abajo. -->
<meta name="theme-color" id="themeColorMeta" content="#2E3440" />
<!-- Sin fondo (canal alfa real): para la barra de título, la pestaña y la barra de
     tareas, donde un cuadrado sólido se ve como un bloque de color pegado al texto.
     El ícono CON fondo (manifest.json) se sigue usando para el ícono de la app
     instalada — ahí sí hace falta, si no queda un vacío en el launcher/escritorio. -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-transparent-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-transparent-192.png" />
<style>
/* ==========================================================================
   Bitácora — versión web. Un solo archivo, sin dependencias.
   Sincroniza contra el MISMO bucket de Supabase que la app Android
   (misma tabla, misma user_key, mismo formato JSON). Ver bloque "Store"
   y "Sync" abajo: los nombres de campo son un contrato fijo compartido.
   ========================================================================== */

/* ===== Sistema de diseño =====================================================
   Paleta Nord: claro = "Snow Storm", oscuro = "Polar Night"; acento = Frost,
   pausado / borrar = Aurora (mismos nombres y valores que la app: colors.xml /
   values-night).
   Superficies sin bordes: la jerarquía la dan el tono (paper < card < surface2) y una
   sombra mínima en claro. El acento (--indigo) y "corriendo" (--live) los cambia el
   tema del perfil; --accentSoft / --liveSoft son sus versiones tenues para fondos. */
:root {
  --paper:#ECEFF4; --card:#FAFBFC; --surface2:#E5E9F0;
  --ink:#2E3440; --inkSoft:#4C566A; --muted:#7A869B;
  --line:#D8DEE9; --grid:#E5E9F0;
  --indigo:#5E81AC; --live:#3F86B0; --paused:#C2784F; --danger:#BF616A;
  --shadow:0 1px 2px rgba(46,52,64,.05), 0 2px 8px rgba(46,52,64,.06);
  --shadowUp:0 8px 30px rgba(46,52,64,.2);
  --scrim:rgba(46,52,64,.4); --raised:#FAFBFC; --onAccent:#FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:#2E3440; --card:#3B4252; --surface2:#434C5E;
    --ink:#ECEFF4; --inkSoft:#D8DEE9; --muted:#9AA4B6;
    --line:#434C5E; --grid:#434C5E;
    --indigo:#81A1C1; --live:#88C0D0; --paused:#EBCB8B; --danger:#BF616A;
    --shadow:none; --shadowUp:0 8px 30px rgba(0,0,0,.35); --scrim:rgba(20,24,31,.6);
    --raised:#4C566A; --onAccent:#2E3440;
  }
}
:root[data-theme="light"] {
  --paper:#ECEFF4; --card:#FAFBFC; --surface2:#E5E9F0;
  --ink:#2E3440; --inkSoft:#4C566A; --muted:#7A869B;
  --line:#D8DEE9; --grid:#E5E9F0;
  --indigo:#5E81AC; --live:#3F86B0; --paused:#C2784F; --danger:#BF616A;
  --shadow:0 1px 2px rgba(46,52,64,.05), 0 2px 8px rgba(46,52,64,.06);
  --shadowUp:0 8px 30px rgba(46,52,64,.2);
  --scrim:rgba(46,52,64,.4); --raised:#FAFBFC; --onAccent:#FFFFFF;
}
:root[data-theme="dark"] {
  --paper:#2E3440; --card:#3B4252; --surface2:#434C5E;
  --ink:#ECEFF4; --inkSoft:#D8DEE9; --muted:#9AA4B6;
  --line:#434C5E; --grid:#434C5E;
  --indigo:#81A1C1; --live:#88C0D0; --paused:#EBCB8B; --danger:#BF616A;
  --shadow:none; --shadowUp:0 8px 30px rgba(0,0,0,.35); --scrim:rgba(20,24,31,.6);
  --raised:#4C566A; --onAccent:#2E3440;
}
:root {
  --accentSoft:color-mix(in srgb, var(--indigo) 13%, var(--card));
  --liveSoft:color-mix(in srgb, var(--live) 12%, var(--card));
  --pausedSoft:color-mix(in srgb, var(--paused) 13%, var(--card));
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; padding:0; }
button { font:inherit; color:inherit; }

/* Scrollbar acorde al tema en vez del gris nativo del navegador (Firefox + Chromium/Edge). */
html { scrollbar-color: var(--line) var(--paper); scrollbar-width: thin; }
::-webkit-scrollbar { width:12px; height:12px; }
::-webkit-scrollbar-track { background:var(--paper); }
::-webkit-scrollbar-thumb { background:var(--line); border-radius:8px; border:3px solid var(--paper); }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }

body {
  background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.35; -webkit-font-smoothing:antialiased;
}
/* Números: tabulares (todos los dígitos del mismo ancho, así el cronómetro no "baila")
   pero con la fuente del sistema, en vez de la monoespaciada de antes. */
.num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; letter-spacing:-.01em; }
.ico { width:20px; height:20px; flex:none; display:block; }

/* Columna centrada tipo teléfono. En pantalla ancha (desktop) se abre a dos paneles. */
.wrap { max-width:540px; margin:0 auto; padding:20px 16px 72px; }

/* Angosto (celu/tablet): una sola columna con tabs; se muestra solo el panel activo.
   El modo ancho (dos paneles) está al final del CSS para ganar en orden de cascada. */
.panes { display:block; }
.pane-title { display:none; }
body[data-tab="timer"] #resumenView { display:none; }
body[data-tab="resumen"] #timerView { display:none; }

/* Header */
.hd { display:flex; align-items:center; gap:8px; }
.hd .title { font-size:24px; font-weight:800; letter-spacing:-.6px; line-height:1.1; }
.hd .sub { font-size:13px; color:var(--muted); margin-top:3px; }
.hd .sub::first-letter { text-transform:uppercase; }
.hd .spacer { flex:1; }
.iconbtn { width:40px; height:40px; border-radius:50%; border:none; background:var(--card);
  box-shadow:var(--shadow); color:var(--inkSoft); display:flex; align-items:center;
  justify-content:center; cursor:pointer; flex:none; }
.iconbtn:hover { color:var(--ink); }
.profbtn { display:flex; align-items:center; gap:8px; height:40px; padding:0 12px 0 4px;
  border:none; border-radius:20px; background:var(--card); box-shadow:var(--shadow);
  cursor:pointer; font-weight:700; font-size:14px; max-width:200px; }
.profbtn .pname { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.profbtn .ico { width:16px; height:16px; color:var(--muted); }
.avatar { position:relative; width:32px; height:32px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center; color:#fff;
  font-weight:800; font-size:14px; }
/* Estado de la sincronización: puntito sobre el avatar del perfil. */
.dot-sync { position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%;
  background:var(--muted); border:2px solid var(--card); transition:background .3s; }
.dot-sync.ok { background:#3E9B5B; }
.dot-sync.sync { background:var(--paused); }
.dot-sync.err { background:var(--danger); }

/* Control segmentado (pestañas y período): pista tenue, opción activa "levantada". */
.tabs, .seg { display:flex; background:var(--surface2); border-radius:14px; padding:4px; }
.tabs { margin-top:18px; }
.seg { margin-top:16px; }
.tab, .seg .s { flex:1; text-align:center; padding:9px 6px; border-radius:10px; cursor:pointer;
  color:var(--inkSoft); font-size:14px; font-weight:600; user-select:none; transition:background .15s,color .15s; }
.tab.active, .seg .s.active { background:var(--raised); color:var(--ink); box-shadow:var(--shadow); }

/* Tarjeta base */
.card { background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); }

/* Hero: la sesión en curso, con el lenguaje de la notificación (swatch + cronómetro
   grande + botón principal lleno). Se tiñe con el color de la actividad. */
.hero { margin-top:16px; padding:18px; border-radius:24px; background:var(--card);
  box-shadow:var(--shadow); position:relative; overflow:hidden; }
.hero.on { background:color-mix(in srgb, var(--act) 11%, var(--card)); }
.hero .top { display:flex; align-items:center; gap:12px; }
.hero .eyebrow { font-size:11px; font-weight:800; letter-spacing:.12em; color:var(--muted); text-transform:uppercase;
  display:flex; align-items:center; gap:6px; }
.hero.on .eyebrow { color:var(--live); }
.hero.on.paused .eyebrow { color:var(--paused); }
.pulse { width:8px; height:8px; border-radius:50%; background:currentColor; }
.hero.on:not(.paused) .pulse { animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.35; transform:scale(.75); } }
.hero .nm { font-size:17px; font-weight:800; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hero .cat { font-size:13px; color:var(--inkSoft); }
.hero .meta { flex:1; min-width:0; }
.hero .chrono { font-size:52px; font-weight:600; letter-spacing:-1.5px; line-height:1; margin:16px 0 2px; }
.hero.paused .chrono { color:var(--inkSoft); }
.hero .hint { font-size:13px; color:var(--muted); margin-top:6px; }
.hero .actions { display:flex; gap:10px; margin-top:16px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:46px;
  padding:0 18px; border-radius:23px; border:none; cursor:pointer; font-weight:700; font-size:15px;
  white-space:nowrap; flex:1; transition:filter .15s, transform .1s; }
.btn:active { transform:scale(.98); }
.btn .ico { width:18px; height:18px; }
.btn.primary { background:var(--indigo); color:var(--onAccent); }
.btn.primary:hover { filter:brightness(1.08); }
.btn.tonal { background:color-mix(in srgb, var(--ink) 9%, transparent); color:var(--ink); }
.btn.tonal:hover { background:color-mix(in srgb, var(--ink) 11%, transparent); }
.btn.small { height:38px; font-size:14px; flex:none; }

/* Swatch de identidad: cuadrado redondeado con el ícono de la categoría (o la inicial)
   sobre el color de la actividad. Mismo elemento que la notificación de la app. */
.swatch { --mixIcon:100%; width:42px; height:42px; border-radius:13px; flex:none; display:flex; align-items:center;
  justify-content:center; font-weight:800; font-size:17px;
  background:color-mix(in srgb, var(--c) 15%, transparent); color:color-mix(in srgb, var(--c) var(--mixIcon), #fff); }
/* En oscuro los colores de actividad (apagados) se aclaran un poco para que el ícono se lea. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .swatch { --mixIcon:50%; } }
:root[data-theme="dark"] .swatch { --mixIcon:50%; }
.swatch .ico { width:22px; height:22px; }
.swatch.solid { background:var(--c); color:#fff; }
.swatch.big { width:48px; height:48px; border-radius:15px; }

/* Encabezado de sección (Actividades / Archivadas / gráficos) */
.sechd { display:flex; align-items:center; margin:22px 4px 10px; }
.sechd .t { flex:1; font-size:13px; font-weight:700; color:var(--inkSoft); }
.sechd .t.click { cursor:pointer; user-select:none; display:flex; align-items:center; gap:4px; }
.sechd .t .ico { width:16px; height:16px; }
.textbtn { border:none; background:none; color:var(--indigo); font-weight:700; font-size:13px;
  cursor:pointer; padding:4px 2px; display:inline-flex; align-items:center; gap:4px; }
.textbtn .ico { width:16px; height:16px; }

/* Filas de actividad */
.rowc { margin-top:8px; background:var(--card); border-radius:var(--r-md); box-shadow:var(--shadow);
  overflow:hidden; transition:background .2s; }
.rowc.running { background:var(--liveSoft); box-shadow:inset 0 0 0 2px var(--live); }
.rowc.paused { background:var(--pausedSoft); box-shadow:inset 0 0 0 2px var(--paused); }
.rowc.arch { opacity:.6; }
.row { display:flex; align-items:center; gap:12px; padding:11px 8px 11px 12px; cursor:pointer; user-select:none; }
.row:hover { background:color-mix(in srgb, var(--ink) 3%, transparent); }
.row .mid { flex:1; min-width:0; }
.row .name { font-size:15.5px; font-weight:700; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical;
  -webkit-line-clamp:2; line-clamp:2; overflow-wrap:anywhere; line-height:1.25; }
.row .type { font-size:12.5px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .today { font-size:15px; font-weight:600; flex:none; text-align:right; }
.rowc.running .today { color:var(--live); }
.rowc.paused .today { color:var(--paused); }
.row .zero { color:var(--muted); font-weight:500; }
.playbtn { width:36px; height:36px; border-radius:50%; flex:none; display:flex; align-items:center;
  justify-content:center; background:var(--accentSoft); color:var(--indigo); }
.playbtn .ico { width:18px; height:18px; }
.rowc.running .playbtn { background:var(--live); color:var(--onAccent); }
.rowc.paused .playbtn { background:var(--paused); color:var(--onAccent); }
.expbtn { width:30px; height:36px; flex:none; display:flex; align-items:center; justify-content:center;
  color:var(--muted); border-radius:10px; }
.expbtn:hover { color:var(--ink); background:color-mix(in srgb, var(--ink) 6%, transparent); }
.expbtn .ico { width:18px; height:18px; transition:transform .2s; }
.expbtn.open .ico { transform:rotate(180deg); }

/* Entradas de hoy (desplegable dentro de la misma tarjeta de la fila) */
.panel { padding:4px 14px 10px 66px; }
.panel .ptitle { font-size:12px; font-weight:700; color:var(--muted); padding:6px 0 2px; }
.srow { display:flex; align-items:center; padding:6px 0; border-top:1px solid var(--line); }
.ptitle + .srow { border-top:none; }
.srow .slabel { flex:1; font-size:14px; color:var(--inkSoft); }
.srow .sdur { font-size:14px; font-weight:600; margin-right:4px; }
.srow .sdel { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:var(--muted); cursor:pointer; }
.srow .sdel:hover { color:var(--danger); background:color-mix(in srgb, var(--danger) 10%, transparent); }
.srow .sdel .ico { width:16px; height:16px; }
.pempty { color:var(--muted); font-size:13px; padding:6px 0 4px; }

/* Nueva actividad */
.addcard { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:10px;
  padding:15px; border-radius:var(--r-md); border:none; background:var(--accentSoft); color:var(--indigo);
  font-weight:700; font-size:15px; cursor:pointer; }
.addcard:hover { filter:brightness(.97); }
.addcard .ico { width:18px; height:18px; }

.emptyhint { color:var(--muted); text-align:center; padding:18px 0 6px; font-size:14px; }

/* Resumen: navegación de período */
.nav { display:flex; align-items:center; margin-top:12px; gap:8px; }
.nav .ar { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink); background:var(--card); box-shadow:var(--shadow); user-select:none; }
.nav .ar.off { color:var(--line); cursor:default; box-shadow:none; background:transparent; }
.nav .navlbl { flex:1; text-align:center; font-weight:700; font-size:15px; }

/* Filtro por categoría */
.chip { display:inline-flex; align-items:center; gap:7px; border-radius:18px; flex:none;
  background:var(--card); box-shadow:var(--shadow); color:var(--inkSoft);
  padding:8px 13px; font-size:13px; font-weight:600; cursor:pointer; user-select:none; white-space:nowrap; }
.chip.active { background:var(--ink); color:var(--paper); box-shadow:none; }
.chip .cdot { width:8px; height:8px; border-radius:50%; }
.catrow { display:flex; gap:8px; overflow-x:auto; padding:12px 2px 4px; margin:0 -2px; scrollbar-width:none; }
.catrow::-webkit-scrollbar { display:none; }

/* Total del período + gráfico, en una tarjeta */
.statcard { margin-top:14px; padding:18px 18px 12px; }
.statcard .lbl { font-size:13px; font-weight:700; color:var(--muted); }
.total { font-size:44px; font-weight:600; letter-spacing:-1.2px; line-height:1.05; margin-top:4px; }
.statcard .sub { font-size:13px; color:var(--inkSoft); margin-top:4px; }
.empty { color:var(--muted); padding:22px 0 10px; text-align:center; }

/* Gráfico de barras: barras con punta redondeada sobre una "pista" tenue, así se ve la
   forma del período aunque haya días vacíos. */
.chart { display:flex; align-items:flex-end; margin-top:18px; height:150px; gap:6px; }
.chart.dense { gap:2px; }
.chart .cbar { flex:1; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; height:100%; min-width:0; }
.chart .cval { font-size:10px; color:var(--inkSoft); text-align:center; white-space:nowrap; margin-bottom:4px; font-weight:600; }
.chart .ctrack { width:100%; flex:1; display:flex; flex-direction:column; justify-content:flex-end;
  background:var(--grid); border-radius:8px; overflow:hidden; }
.chart.dense .ctrack { border-radius:4px; }
.chart .cfill { width:100%; border-radius:8px; min-height:4px; }
.chart.dense .cfill { border-radius:4px; }
.chart .cstack { width:100%; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
.chart .cseg { width:100%; }
.chart .cseg + .cseg { border-top:2px solid var(--card); }
.chart .clab { font-size:11px; color:var(--muted); margin-top:6px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; max-width:100%; height:14px; }
.chart .clab.today { color:var(--ink); font-weight:800; }

/* Desglose (por actividad / por categoría): una tarjeta con filas, no una tarjeta por fila */
.list { padding:6px 16px; margin-top:8px; }
.stat { padding:11px 0; border-top:1px solid var(--line); }
.stat:first-child { border-top:none; }
.stat.click { cursor:pointer; }
.stat .top { display:flex; align-items:center; gap:10px; }
.stat .sdot { width:10px; height:10px; border-radius:50%; flex:none; }
.stat .snm { flex:1; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stat .sval { font-size:14px; font-weight:600; }
.stat .spct { font-size:12.5px; color:var(--muted); width:38px; text-align:right; }
.track { height:6px; background:var(--grid); border-radius:3px; margin-top:8px; overflow:hidden; }
.track .fill { height:100%; border-radius:3px; }

.csvbtn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:18px; padding:14px;
  background:var(--card); box-shadow:var(--shadow); border:none; border-radius:var(--r-md);
  color:var(--indigo); font-weight:700; cursor:pointer; font-size:14px; }
.csvbtn .ico { width:18px; height:18px; }

/* Diálogos: centrados en pantalla ancha; en el celu, hoja que sube desde abajo. */
.overlay { position:fixed; inset:0; background:var(--scrim); display:flex;
  align-items:center; justify-content:center; padding:18px; z-index:50; animation:fade .15s ease-out; }
.dialog { background:var(--card); border-radius:26px; box-shadow:var(--shadowUp);
  padding:22px; width:100%; max-width:420px; max-height:90vh; overflow:auto; animation:pop .18s ease-out; }
@keyframes fade { from { opacity:0; } }
@keyframes pop { from { opacity:0; transform:translateY(8px) scale(.98); } }
@media (max-width:600px) {
  .overlay { align-items:flex-end; padding:0; }
  .dialog { max-width:none; border-radius:26px 26px 0 0; padding:12px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh; animation:sheet .22s ease-out; }
  .dialog::before { content:""; display:block; width:40px; height:4px; border-radius:2px;
    background:var(--line); margin:0 auto 14px; }
  @keyframes sheet { from { transform:translateY(40px); opacity:.4; } }
}
.dialog h3 { margin:0 0 16px; font-size:20px; font-weight:800; letter-spacing:-.3px; }
.dialog p { color:var(--inkSoft); margin:0 0 16px; }
.field { width:100%; padding:13px 14px; border:2px solid transparent; border-radius:14px;
  background:var(--surface2); color:var(--ink); font:inherit; font-size:16px; margin-bottom:6px; }
.field:focus { outline:none; border-color:var(--indigo); background:var(--card); }
.field.bad { border-color:var(--danger); }
.flabel { font-size:13px; font-weight:700; color:var(--inkSoft); margin:16px 0 8px; }
.swatches { display:flex; gap:10px; overflow-x:auto; padding:3px 3px 4px; scrollbar-width:none; }
.swatches::-webkit-scrollbar { display:none; }
.sw { width:32px; height:32px; border-radius:50%; flex:none; cursor:pointer;
  box-shadow:0 0 0 0 var(--card), 0 0 0 0 var(--ink); transition:box-shadow .15s; }
.sw.sel { box-shadow:0 0 0 3px var(--card), 0 0 0 5px var(--ink); }
.linkbtn { display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:16px 0 2px; font-size:14px;
  font-weight:700; color:var(--inkSoft); cursor:pointer; text-align:left; }
.linkbtn .ico { width:18px; height:18px; }
/* Selector de categorías dentro del diálogo de actividad, y grilla de íconos dentro del
   diálogo de categoría. */
.catpick { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; scrollbar-width:none; }
.catpick::-webkit-scrollbar { display:none; }

<script>
"use strict";

/* ====================== CONFIG (mismo bucket que la app) ================= */
const CFG = {
  url: "https://rjjrudenrxixofwhsknk.supabase.co",
  key: "sb_publishable_moRNgc6pbh-OfyK9193D9Q_hQblC5xz",

};

/* Perfiles: mismo esquema que la app. El perfil "default" (Principal) usa la
   userKey base tal cual; los demás usan userKey::<id>. El índice va en userKey::index. */
const BASE = CFG.userKey;
const INDEX_KEY = BASE + "::index";
const bucketKey = pid => (!pid || pid === "default") ? BASE : BASE + "::" + pid;

/* 5 temas: cada uno cambia el acento (indigo) y el "corriendo" (live). Los neutros
   no cambian, igual que en la app. Aplicados por CSS vía data-palette. */
const THEME_ORDER = ["azul", "verde", "violeta", "arcilla", "grafito"];
const THEME_ACCENT = { azul:"#5E81AC", verde:"#5F8A4E", violeta:"#8A6585", arcilla:"#B4694F", grafito:"#4C566A" };

/* 14 colores de actividad — mismos que Store.COLORS en la app. */
const COLORS = ["#5E81AC","#BF616A","#6E9F5A","#D08770","#8A6585","#4C8A8A","#B48EAD",
  "#C29B4A","#4C566A","#3E7A99","#A35D6A","#5F7F4A","#B4694F","#6F8FB4"];

// Mismo set curado que CategoryIcons.kt del lado Android — mismas claves (contrato
// compartido: el campo "icon" de una categoría tiene que significar lo mismo en los
// dos lados) y mismo pathData de los vectores (la sintaxis de Android es compatible
// 1:1 con el atributo "d" de un <path> SVG).
const CATEGORY_ICON_PATHS = {
  book: [{ d: "M3,5h8v14h-8z M13,5h8v14h-8z" }],
  school: [
    { d: "M12,4L22,9L12,14L2,9Z" },
    { d: "M12,12.5L12,18", stroke: true },
    { d: "M10.4,19.2a1.6,1.6 0,1 0,3.2 0a1.6,1.6 0,1 0,-3.2 0z" }
  ],
  work: [
    { d: "M9,8v-2a1,1 0,0 1,1,-1h4a1,1 0,0 1,1,1v2", stroke: true },
    { d: "M4,8h16v11h-16z" }
  ],
  flask: [{ d: "M10,3h4v6l6,11h-16l6,-11z" }],
  code: [
    { d: "M9,7l-5,5l5,5", stroke: true, round: true },
    { d: "M15,7l5,5l-5,5", stroke: true, round: true }
  ],
  pencil: [{ d: "M3,21l1,-4l13,-13l3,3l-13,13z" }, { d: "M4,17l3,3l-4,1z" }],
  fitness: [{ d: "M2,10h2v4h-2z M20,10h2v4h-2z M5,8.5h2v7h-2z M17,8.5h2v7h-2z M7,11h10v2h-10z" }],
  music: [
    { d: "M8,17a3,3 0,1 0,0.1 0z" },
    { d: "M10.8,5h1.6v12h-1.6z" },
    { d: "M12.4,5l4,1.6v3.2l-4,-1.6z" }
  ],
  globe: [
    { d: "M12,3a9,9 0,1 0,0.1 0z", stroke: true },
    { d: "M12,3c-3.4,3 -3.4,15 0,18", stroke: true },
    { d: "M3,12h18", stroke: true }
  ],
  folder: [{ d: "M3,6h6l2,2h10v11h-18z" }]
};
const CATEGORY_ICON_ORDER = Object.keys(CATEGORY_ICON_PATHS);
function categoryIconEl(key, color) {
  const parts = CATEGORY_ICON_PATHS[key];
  if (!parts) return null;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  for (const p of parts) {
    const path = document.createElementNS(ns, "path");
    path.setAttribute("d", p.d);
    if (p.stroke) {
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", color);
      path.setAttribute("stroke-width", "1.7");
      if (p.round) { path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round"); }
    } else {
      path.setAttribute("fill", color);
    }
    svg.appendChild(path);
  }
  return svg;
}

const DAY_MS = 86400000;
const now = () => Date.now();
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "id-" + Math.random().toString(36).slice(2) + now().toString(36));

/* ====================== STORE (espejo de Store.kt) ====================== */
/* El objeto raíz usa los MISMOS nombres de campo que la app, porque payload()
   y merge() tienen que hablar exactamente el mismo idioma que el lado Kotlin. */
const Store = {
  _root: null,
  _rootProfile: null,

  // ---- perfil activo (local, por dispositivo) ----
  hasChosenProfile() { return localStorage.getItem("bitacora_profile") != null; },
  currentProfileId() { return localStorage.getItem("bitacora_profile") || "default"; },
  setCurrentProfile(id) { localStorage.setItem("bitacora_profile", id); this._root = null; this._rootProfile = null; },
  // El perfil "default" usa la clave histórica "bitacora" (adopta lo que ya había).
  dataKey(pid) { return (!pid || pid === "default") ? "bitacora" : "bitacora_" + pid; },
  clearProfileData(pid) {
    localStorage.removeItem(this.dataKey(pid));
    if (this._rootProfile === pid) { this._root = null; this._rootProfile = null; }
  },

  root() {
    const pid = this.currentProfileId();
    if (this._root && this._rootProfile === pid) return this._root;
    let obj = {};
    try { const raw = localStorage.getItem(this.dataKey(pid)); if (raw) obj = JSON.parse(raw); } catch (e) {}
    if (!Array.isArray(obj.activities)) obj.activities = [];
    if (!Array.isArray(obj.sessions)) obj.sessions = [];
    if (obj.runActId == null) obj.runActId = "";
    if (obj.runStart == null) obj.runStart = 0;
    if (obj.runChangedAt == null) obj.runChangedAt = 0;
    if (obj.runPaused == null) obj.runPaused = false;
    if (obj.runPausedAt == null) obj.runPausedAt = 0;
    if (obj.runPausedAccum == null) obj.runPausedAccum = 0;
    // Limpiezas idempotentes: solo escriben si de verdad cambiaron algo, así dos cargas
    // seguidas nunca generan escrituras (ni sync) de la nada.
    let changed = false;
    if (!Array.isArray(obj.categories)) { this._migrateCategoriesFromTypes(obj); changed = true; }
    changed = this._dedupeCategoriesByName(obj) || changed;
    this._root = obj; this._rootProfile = pid;
    if (changed) this.write(obj);
    return obj;
  },
  write(obj) {
    const pid = this.currentProfileId();
    this._root = obj; this._rootProfile = pid;
    try { localStorage.setItem(this.dataKey(pid), JSON.stringify(obj)); } catch (e) {}
  },

  // Un string con forma de id (UUID random o el hash estable de abajo). Blinda la
  // migración: si "type" YA es un id (por ejemplo porque esto es un re-run sobre datos
  // que otra plataforma/versión ya había migrado), nunca hay que adoptar ese id como si
  // fuera el nombre de una categoría — mismo criterio que Store.looksLikeId en Kotlin.
  _looksLikeId(s) {
    return /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(s)
      || s.startsWith("cat-");
  },

  // Id ESTABLE derivado del nombre (FNV-1a 32 bits — mismo algoritmo, bit a bit, que
  // Store.stableCategoryId en Kotlin). Antes la migración usaba uid() (random): si
  // corría de forma independiente en el celu, en la web, o tras una reinstalación,
  // cada una generaba un id DISTINTO para la misma categoría ("Materia" x3, "Libro"
  // x3...). Con un id determinístico, dos migraciones para el mismo nombre siempre
  // coinciden y ya no pueden crear duplicados.
  _stableCategoryId(name) {
    const bytes = new TextEncoder().encode(name.trim().toLowerCase());
    let hash = 0x811c9dc5;
    for (const b of bytes) {
      hash ^= b;
      hash = Math.imul(hash, 0x01000193) >>> 0;
    }
    return "cat-" + hash.toString(16).padStart(8, "0");
  },

  // Antes "type" en cada actividad era un string libre. Espejo exacto de
  // Store.migrateCategoriesFromTypes en Kotlin: una sola vez, convierte cada valor
  // distinto de "type" en una categoría real y reescribe el campo de la actividad
  // de nombre a id. updatedAt=0 para que cualquier edición real le gane en el merge.
  _migrateCategoriesFromTypes(obj) {
    const byName = new Map();
    let i = 0;
    for (const a of obj.activities) {
      const raw = (a.type || "").trim();
      const name = (!raw || this._looksLikeId(raw)) ? "General" : raw;
      let cat = byName.get(name);
      if (!cat) {
        cat = { id: this._stableCategoryId(name), name, icon: "", color: a.color || COLORS[i % COLORS.length], updatedAt: 0, deleted: false };
        byName.set(name, cat);
        i++;
      }
      a.type = cat.id;
    }
    obj.categories = [...byName.values()];
  },

  // Limpieza de las categorías duplicadas creadas ANTES de este fix (ids random
  // distintos para el mismo nombre). Espejo exacto de Store.dedupeCategoriesByName en
  // Kotlin: agrupa por nombre normalizado, deja una sola categoría por grupo (con el id
  // que ya tenía), reasigna las actividades que apuntaban a cualquier id del grupo, y
  // marca el resto como borradas. Devuelve true si cambió algo.
  _dedupeCategoriesByName(obj) {
    // OJO: agrupamos TAMBIÉN las ya borradas — una actividad puede seguir apuntando al
    // id de una categoría marcada "deleted" en una limpieza anterior; si la excluimos
    // del grupo esa actividad nunca entra al remapeo y se queda huérfana ("General").
    const groups = new Map();
    for (const c of obj.categories) {
      const key = (c.name || "General").trim().toLowerCase() || "general";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(c);
    }
    const remap = new Map();
    let changed = false;
    for (const group of groups.values()) {
      if (group.length < 2) continue;
      const alive = group.filter(c => !c.deleted);
      // Preferimos una viva con ícono ya elegido a mano. Si TODAS están borradas, se
      // consolida igual (para que el remap de actividades funcione) pero queda borrada:
      // nunca se resucita una categoría que el usuario borró a propósito.
      // Dentro de cada opción gana el id menor: la elección tiene que ser la MISMA en
      // todos los dispositivos (ver Store.dedupeCategoriesByName). Con "la primera de la
      // lista local", dos dispositivos podían borrarse mutuamente la misma categoría.
      const withIcon = alive.filter(c => c.icon);
      const pool = withIcon.length ? withIcon : (alive.length ? alive : group);
      const keep = pool.reduce((m, c) => (c.id < m.id ? c : m));
      // El id de la que se conserva NO se reescribe nunca (ver el comentario largo en
      // Store.dedupeCategoriesByName): asignarle un "id canónico" derivado del nombre
      // hacía que la tabla de remapeo, que es común a todos los grupos, se pisara entre
      // grupos y mandara actividades a la categoría equivocada.
      const keepId = keep.id;
      for (const c of group) {
        if (c === keep) continue;
        remap.set(c.id, keepId);
        // Solo se toca lo que realmente cambia: reescribir updatedAt de entradas ya
        // borradas en cada carga generaba escrituras y sync a lo pavote.
        if (!c.deleted) { c.deleted = true; c.updatedAt = now(); changed = true; }
      }
    }
    if (remap.size) {
      for (const a of obj.activities) {
        const newId = remap.get(a.type);
        if (newId) { a.type = newId; a.updatedAt = now(); changed = true; }
      }
    }
    return changed;
  },

  // ---- categories ----
  categories() { return this.root().categories.filter(c => !c.deleted); },
  categoryById(id) {
    if (!id) return null;
    return this.root().categories.find(c => c.id === id && !c.deleted) || null;
  },
  // Nunca devuelve null: cae a "General" si el id no resuelve (dato viejo/corrupto,
  // o categoría borrada).
  categoryForActivity(act) {
    return this.categoryById(act && act.type) ||
      { id: "", name: "General", icon: "", color: "#2F4B8F" };
  },
  addCategory(name, icon, color) {
    const o = this.root();
    const id = uid();
    o.categories.push({ id, name: name.trim(), icon, color, updatedAt: now(), deleted: false });
    this.write(o);
    return id;
  },
  updateCategory(id, name, icon, color) {
    const o = this.root();
    const c = o.categories.find(x => x.id === id);
    if (c) { c.name = name.trim(); c.icon = icon; c.color = color; c.updatedAt = now(); }
    this.write(o);
  },
  deleteCategory(id) {
    const o = this.root();
    o.categories.forEach(c => { if (c.id === id) { c.deleted = true; c.updatedAt = now(); } });
    o.activities.forEach(a => { if (a.type === id) { a.type = ""; a.updatedAt = now(); } });
    this.write(o);
  },

  // ---- activities ----
  activities(includeArchived = false) {
    return this.root().activities.filter(a =>
      !a.deleted && (includeArchived || !a.archived));
  },
  activityById(id) { return this.root().activities.find(a => a.id === id) || null; },
  addActivity(name, type, color) {
    const o = this.root();
    o.activities.push({ id: uid(), name, type, color, archived:false, updatedAt: now(), deleted:false });
    this.write(o);
  },
  updateActivity(id, name, type, color) {
    const o = this.root();
    const a = o.activities.find(x => x.id === id);
    if (a) { a.name = name; a.type = type; a.color = color; a.updatedAt = now(); }
    this.write(o);
  },
  deleteActivity(id) {
    const o = this.root();
    o.activities.forEach(a => { if (a.id === id) { a.deleted = true; a.updatedAt = now(); } });
    o.sessions.forEach(s => { if (s.actId === id) { s.deleted = true; s.updatedAt = now(); } });
    if (o.runActId === id) {
      o.runActId = ""; o.runStart = 0; o.runPaused = false; o.runPausedAt = 0;
      o.runPausedAccum = 0; o.runChangedAt = now();
    }
    this.write(o);
  },
  setArchived(id, val) {
    const o = this.root();
    o.activities.forEach(a => { if (a.id === id) { a.archived = val; a.updatedAt = now(); } });
    if (val && o.runActId === id) { this._stopInternal(o); o.runChangedAt = now(); }
    this.write(o);
  },
  archiveActivity(id) { this.setArchived(id, true); },
  unarchiveActivity(id) { this.setArchived(id, false); },

  // ---- running ----
  runningActId() { return this.root().runActId || ""; },
  runningPaused() { return !!this.root().runPaused; },
  runningElapsedMs() {
    const o = this.root();
    if (!o.runActId) return 0;
    const end = o.runPaused ? o.runPausedAt : now();
    return Math.max(0, end - o.runStart - o.runPausedAccum);
  },
  // Tocar la activa (corriendo o pausada) la para. Pausar/resumir es aparte.
  toggle(actId) {
    const o = this.root();
    if (o.runActId === actId) {
      this._stopInternal(o);
    } else {
      if (o.runActId) this._stopInternal(o);
      o.runActId = actId; o.runStart = now();
      o.runPaused = false; o.runPausedAt = 0; o.runPausedAccum = 0;
    }
    o.runChangedAt = now();
    this.write(o);
  },
  pause() {
    const o = this.root();
    if (o.runActId && !o.runPaused) { o.runPaused = true; o.runPausedAt = now(); o.runChangedAt = now(); this.write(o); }
  },
  resume() {
    const o = this.root();
    if (o.runActId && o.runPaused) {
      if (o.runPausedAt > 0) o.runPausedAccum += now() - o.runPausedAt;
      o.runPaused = false; o.runPausedAt = 0; o.runChangedAt = now(); this.write(o);
    }
  },
  stop() { const o = this.root(); this._stopInternal(o); o.runChangedAt = now(); this.write(o); },
  _stopInternal(o) {
    const cur = o.runActId, start = o.runStart;
    if (cur && start > 0) {
      // Fórmula canónica compartida con la app: el tiempo pausado no se cuenta.
      const currentEnd = o.runPaused ? o.runPausedAt : now();
      const real = currentEnd - start - o.runPausedAccum;
      if (real >= 1000) {
        o.sessions.push({ id: uid(), actId: cur, start, end: start + real, updatedAt: now(), deleted:false });
      }
    }
    o.runActId = ""; o.runStart = 0; o.runPaused = false; o.runPausedAt = 0; o.runPausedAccum = 0;
  },

  // ---- sessions ----
  deleteSession(id) {
    const o = this.root();
    o.sessions.forEach(s => { if (s.id === id) { s.deleted = true; s.updatedAt = now(); } });
    this.write(o);
  },
  sessionsForActivityToday(actId) {
    const from = startOfToday();
    return this.root().sessions
      .filter(s => !s.deleted && s.actId === actId && s.end >= from)
      .sort((a, b) => b.start - a.start);
  },

  // ---- stats ----
  // Tramo de la sesión en curso tal como va a quedar guardada al pararla: arranca en
  // runStart y dura el tiempo real corrido (ver Store.runningSpan en Kotlin).
  _msByActivity(from, to) {
    const out = {};
    const add = (actId, start, end) => {
      const ms = Math.min(end, to) - Math.max(start, from);
      if (ms > 0) out[actId] = (out[actId] || 0) + ms;
    };
    const o = this.root();
    for (const s of o.sessions) if (!s.deleted) add(s.actId, s.start, s.end);
    if (o.runActId && o.runStart > 0) add(o.runActId, o.runStart, o.runStart + this.runningElapsedMs());
    return out;
  },
  // Segundos por actividad en [from, to), en UNA sola pasada por las sesiones.
  secsByActivity(from, to = Number.MAX_SAFE_INTEGER) {
    const ms = this._msByActivity(from, to), out = {};
    for (const id in ms) out[id] = Math.floor(ms[id] / 1000);
    return out;
  },
  secsFor(actId, from, to = Number.MAX_SAFE_INTEGER) {
    return Math.floor((this._msByActivity(from, to)[actId] || 0) / 1000);
  },
  totalBetween(from, to, actIds = null) {
    const ms = this._msByActivity(from, to);
    let t = 0;
    for (const id in ms) if (!actIds || actIds.has(id)) t += ms[id];
    return Math.floor(t / 1000);
  },

  // ---- csv ----
  exportCsv(from = 0, to = Number.MAX_SAFE_INTEGER, actIds = null) {
    let sb = "actividad,tipo,inicio,fin,duracion_min\n";
    const fmt = d => {
      const p = n => String(n).padStart(2, "0");
      const x = new Date(d);
      return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())} ${p(x.getHours())}:${p(x.getMinutes())}`;
    };
    const list = this.root().sessions
      .filter(s => !s.deleted && (!actIds || actIds.has(s.actId)) && !(s.end < from || s.start >= to))
      .sort((a, b) => a.start - b.start);
    const acts = new Map(this.root().activities.map(a => [a.id, a]));
    // Comillas internas duplicadas (regla de CSV): un nombre con " ya no corre columnas.
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    for (const s of list) {
      const a = acts.get(s.actId);
      const name = a ? a.name : "?";
      const type = a ? this.categoryForActivity(a).name : "";
      const min = ((s.end - s.start) / 60000).toFixed(1);
      sb += `${q(name)},${q(type)},${q(fmt(s.start))},${q(fmt(s.end))},${min}\n`;
    }
    return sb;
  },

  // ---- backup ----
  // Volcado crudo de TODO lo guardado en este navegador: el dataset completo de cada
  // perfil más el índice. Solo lee. Espejo de Store.fullBackup en Kotlin — mismos
  // nombres de campo, así un backup de un lado se entiende del otro.
  // Incluye únicamente los perfiles que tengan datos en ESTE navegador.
  fullBackup() {
    const porPerfil = {};
    for (const p of ProfileStore.profiles()) {
      const raw = localStorage.getItem(this.dataKey(p.id));
      if (!raw) continue;
      try { porPerfil[p.id] = JSON.parse(raw); } catch (e) { /* dato ilegible: se omite */ }
    }
    return {
      app: "bitacora",
      formato: 1,
      exportadoEl: now(),
      perfilActivo: this.currentProfileId(),
      indiceDePerfiles: ProfileStore.payload(),
      perfiles: porPerfil
    };
  },

  // ---- sync payload + merge (contrato con la app) ----
  _payload(r) {
    return {
      activities: JSON.parse(JSON.stringify(r.activities)),
      sessions: JSON.parse(JSON.stringify(r.sessions)),
      categories: JSON.parse(JSON.stringify(r.categories)),
      run: {
        actId: r.runActId || "", start: r.runStart || 0,
        paused: !!r.runPaused, pausedAt: r.runPausedAt || 0, pausedAccum: r.runPausedAccum || 0,
        changedAt: r.runChangedAt || 0
      }
    };
  },
  // Espejo de Store.merge en Kotlin. remote null = el bucket todavía no existe.
  // Devuelve null si el perfil activo ya no es pid (el remoto se bajó para OTRO perfil:
  // fusionarlo mezclaría los datos de dos personas). Si no, { changed, upload }:
  // upload !== null significa que el remoto quedó atrás y hay que subir eso.
  merge(pid, remote) {
    if (this.currentProfileId() !== pid) return null;
    const o = this.root();
    const r = remote || {};
    let changed = mergeList(o.activities, r.activities);
    changed = mergeList(o.sessions, r.sessions) || changed;
    // Un merge puede traer categorías con un nombre que ya existía acá: misma limpieza.
    if (mergeList(o.categories, r.categories)) { this._dedupeCategoriesByName(o); changed = true; }
    // El estado "corriendo" cruza entre dispositivos: gana el cambio más nuevo, entero.
    const rr = r.run;
    const remoteRunAt = (rr && rr.changedAt) || 0;
    if (rr && remoteRunAt > (o.runChangedAt || 0)) {
      o.runActId = rr.actId || ""; o.runStart = rr.start || 0;
      o.runPaused = !!rr.paused; o.runPausedAt = rr.pausedAt || 0;
      o.runPausedAccum = rr.pausedAccum || 0; o.runChangedAt = remoteRunAt;
      changed = true;
    }
    if (changed) this.write(o);
    const behind = isBehind(r.activities, o.activities) || isBehind(r.sessions, o.sessions) ||
      isBehind(r.categories, o.categories) || (o.runChangedAt || 0) > remoteRunAt;
    return { changed, upload: behind ? this._payload(o) : null };
  }
};

// Fusión "gana el updatedAt más nuevo" (espejo de Merge.list en Kotlin). Muta local y
// devuelve true si cambió.
function mergeList(local, remoteArr) {
  if (!Array.isArray(remoteArr)) return false;
  const index = {};
  local.forEach((o, i) => { index[o.id] = i; });
  let changed = false;
  for (const r of remoteArr) {
    if (!r || !r.id) continue;
    const at = index[r.id];
    if (at === undefined) { local.push(r); index[r.id] = local.length - 1; changed = true; }
    else if ((r.updatedAt || 0) > (local[at].updatedAt || 0)) { local[at] = r; changed = true; }
  }
  return changed;
}

// True si local tiene algo que remote no tiene o tiene más viejo: hay que subir (espejo
// de Merge.behind en Kotlin). Es la guarda que evita escrituras de más — cada escritura
// dispara el push a los teléfonos — y se recupera sola si otro dispositivo pisó la fila.
function isBehind(remoteArr, local) {
  const remote = {};
  if (Array.isArray(remoteArr)) for (const r of remoteArr) if (r && r.id) remote[r.id] = r;
  return local.some(l => !remote[l.id] || (l.updatedAt || 0) > (remote[l.id].updatedAt || 0));
}

/* ====================== PROFILE STORE (índice de perfiles) ====================== */
const ProfileStore = {
  _index: null,
  KEY: "bitacora_profiles",
  DEFAULT_THEME: "azul",
  index() {
    if (this._index) return this._index;
    let obj = {};
    try { const raw = localStorage.getItem(this.KEY); if (raw) obj = JSON.parse(raw); } catch (e) {}
    if (!Array.isArray(obj.profiles)) obj.profiles = [];
    // updatedAt:0 → el sembrado por defecto nunca le gana en el merge a un cambio real.
    if (!obj.profiles.some(p => p.id === "default"))
      obj.profiles.push({ id:"default", name:"Principal", theme:this.DEFAULT_THEME, updatedAt: 0, deleted:false });
    this._index = obj; return obj;
  },
  write(obj) { this._index = obj; try { localStorage.setItem(this.KEY, JSON.stringify(obj)); } catch (e) {} },
  profiles() { return this.index().profiles.filter(p => !p.deleted); },
  byId(id) { return this.index().profiles.find(p => p.id === id) || null; },
  isDeleted(id) { const p = this.byId(id); return !!(p && p.deleted); },
  nameOf(id) { const p = this.byId(id); return p ? p.name : "Perfil"; },
  themeOf(id) { const p = this.byId(id); return (p && p.theme) || this.DEFAULT_THEME; },
  add(name, theme) { const o = this.index(); const id = uid();
    o.profiles.push({ id, name, theme, updatedAt: now(), deleted:false }); this.write(o); return id; },
  rename(id, name) { const o = this.index(); const p = o.profiles.find(x => x.id === id);
    if (p) { p.name = name; p.updatedAt = now(); } this.write(o); },
  setTheme(id, theme) { const o = this.index(); const p = o.profiles.find(x => x.id === id);
    if (p) { p.theme = theme; p.updatedAt = now(); } this.write(o); },
  del(id) { if (id === "default") return; const o = this.index(); const p = o.profiles.find(x => x.id === id);
    if (p) { p.deleted = true; p.updatedAt = now(); } this.write(o); Store.clearProfileData(id); },
  payload() { return { profiles: JSON.parse(JSON.stringify(this.index().profiles)) }; },
  merge(remote) {
    const o = this.index();
    const rem = remote && remote.profiles;
    const changed = mergeList(o.profiles, rem);
    if (changed) this.write(o);
    return { changed, upload: isBehind(rem, o.profiles) ? this.payload() : null };
  }
};

/* ====================== SYNC (espejo de Sync.kt) ====================== */
let syncing = false;
function authHeaders(extra) {
  const h = { apikey: CFG.key };
  if (CFG.key.startsWith("eyJ")) h["Authorization"] = "Bearer " + CFG.key;
  return Object.assign(h, extra || {});
}
// null = el bucket todavía no existe. Cualquier error lanza: si la bajada falla no se
// sube nada, porque subir a ciegas pisaría lo que subieron otros dispositivos.
async function pull(userKey) {
  const url = `${CFG.url}/rest/v1/buckets?user_key=eq.${encodeURIComponent(userKey)}&select=data`;
  const r = await fetch(url, { headers: authHeaders({ Accept: "application/json" }) });
  if (!r.ok) throw new Error("pull " + r.status);
  const arr = await r.json();
  return arr.length ? arr[0].data : null;
}
async function push(userKey, data) {
  const url = `${CFG.url}/rest/v1/buckets?on_conflict=user_key`;
  const body = [{ user_key: userKey, data, updated_at: now() }];
  const r = await fetch(url, {
    method: "POST",
    headers: authHeaders({ "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error("push " + r.status);
}
function setSync(state) { const d = document.getElementById("syncDot"); d.className = "dot-sync " + state; }
// Bajar → fusionar → subir SOLO si el remoto quedó atrás. Nunca subir sin necesidad es
// la regla más importante: cada escritura dispara el push que despierta a los teléfonos.
// Devuelve true si algo local cambió.
async function syncBucket(userKey, mergeFn) {
  const result = mergeFn(await pull(userKey));
  if (!result) return false;
  if (result.upload) await push(userKey, result.upload);
  return result.changed;
}
const syncIndex = () => syncBucket(INDEX_KEY, r => ProfileStore.merge(r));
// afterLocalChange: lo pide una acción del usuario. Si llega con otro sync en curso, se
// encadena uno más al terminar, en vez de perderlo y esperar al próximo ciclo de 10 s
// para que el cambio salga. Los pedidos sin cambio local (ciclo, foco) sí se descartan.
let syncAgain = false;
let lastSyncAt = 0;
async function sync(afterLocalChange = false) {
  if (syncing) { if (afterLocalChange) syncAgain = true; return; }
  syncing = true; syncAgain = false; lastSyncAt = Date.now(); setSync("sync");
  Live.watch([INDEX_KEY, bucketKey(Store.currentProfileId())]);
  try {
    const indexChanged = await syncIndex();
    // El perfil se fija UNA vez, antes de bajar: si el usuario cambia de perfil mientras
    // tanto, Store.merge lo detecta y descarta el ciclo (no mezcla datos de dos perfiles).
    const pid = Store.currentProfileId();
    const dataChanged = await syncBucket(bucketKey(pid), r => Store.merge(pid, r));
    setSync("ok");
    // Solo se redibuja si llegó algo: este ciclo corre cada 10 s.
    if (indexChanged || dataChanged) onRemoteChange();
  } catch (e) { setSync("err"); }
  finally {
    syncing = false;
    if (syncAgain) sync(true);
  }
}

/* ====================== LIVE (Supabase Realtime) ======================
   Conexión abierta con el servidor: avisa apenas cambia el bucket del perfil activo (o
   el índice de perfiles), y entonces se corre sync(). Es el equivalente web del push
   de la app: un "timbre" sin datos — el aviso trae la fila entera, pero se ignora y se
   va a buscar por el camino normal, que ya sabe fusionar y descartar lo de otro perfil.

   Cliente mínimo del protocolo Phoenix (vsn 2.0.0: cada mensaje es un array
   [join_ref, ref, topic, event, payload]) en vez de supabase-js: son ~200 KB para usar
   una sola función. Requiere que la tabla esté en la publicación de Realtime (ver
   supabase/realtime.sql); si no lo está, el servidor contesta con un "system" de error,
   Live.ok queda en false y el ciclo de sondeo sigue a 10 s como siempre. */
const Live = {
  ok: false,
  _ws: null, _keys: "", _ref: 0, _topic: "", _hb: null, _retry: 0, _debounce: null,
  watch(keys) {
    const k = keys.join("|");
    if (k === this._keys && this._ws) return;
    this._keys = k;
    if (this._ws && this._ws.readyState === WebSocket.OPEN) this._join(); else this._connect();
  },
  _send(joinRef, topic, event, payload) {
    if (!this._ws || this._ws.readyState !== WebSocket.OPEN) return;
    this._ws.send(JSON.stringify([joinRef, String(++this._ref), topic, event, payload]));
  },
  _connect() {
    if (typeof WebSocket === "undefined") return;
    if (this._ws) { this._ws.onclose = null; this._ws.close(); }
    const url = CFG.url.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" +
      encodeURIComponent(CFG.key) + "&vsn=2.0.0";
    const ws = new WebSocket(url);
    this._ws = ws;
    ws.onopen = () => {
      this._retry = 0;
      this._join();
      clearInterval(this._hb);
      this._hb = setInterval(() => this._send(null, "phoenix", "heartbeat", {}), 25000);
    };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch (_) { return; }
      const [, , topic, event, payload] = m;
      if (topic !== this._topic) return;
      if (event === "phx_reply" && payload && payload.status !== "ok") this.ok = false;
      else if (event === "system" && payload) this.ok = payload.status === "ok";
      else if (event === "postgres_changes") {
        this.ok = true;
        clearTimeout(this._debounce);
        this._debounce = setTimeout(() => sync(), 150);
      }
    };
    ws.onclose = () => {
      this.ok = false;
      clearInterval(this._hb);
      // Reintento con espera creciente (1 s, 2 s, 4 s... hasta 60 s).
      const wait = Math.min(60000, 1000 * 2 ** this._retry++);
      setTimeout(() => { if (this._ws === ws) this._connect(); }, wait);
    };
  },
  _join() {
    if (this._topic) this._send(null, this._topic, "phx_leave", {});
    this.ok = false;
    this._topic = "realtime:bitacora-" + (++this._ref);
    const changes = this._keys.split("|").map(k =>
      ({ event: "*", schema: "public", table: "buckets", filter: "user_key=eq." + k }));
    this._send(String(this._ref), this._topic, "phx_join", {
      config: { broadcast: { self: false }, presence: { key: "", enabled: false },
        postgres_changes: changes, private: false }
    });
  }
};

/* ====================== HELPERS DE FECHA / FORMATO ====================== */
function midnight(d) { d.setHours(0, 0, 0, 0); return d.getTime(); }
function startOfToday() { return midnight(new Date()); }

function periodRange(period, offset) {
  const base = new Date();
  if (period === "day") {
    const d = new Date(base); d.setDate(d.getDate() + offset);
    const from = midnight(d); return [from, from + DAY_MS];
  }
  if (period === "week") {
    const d = new Date(base); d.setDate(d.getDate() + offset * 7);
    const dow = d.getDay(); const back = dow === 0 ? 6 : dow - 1;
    d.setDate(d.getDate() - back); const from = midnight(d);
    return [from, from + 7 * DAY_MS];
  }
  const d = new Date(base.getFullYear(), base.getMonth() + offset, 1);
  const from = midnight(d);
  const d2 = new Date(base.getFullYear(), base.getMonth() + offset + 1, 1);
  return [from, midnight(d2)];
}
function daysInMonth(from) { const d = new Date(from); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }

function periodLabel(period, offset, from, to) {
  const L = "es-AR";
  if (period === "day") {
    if (offset === 0) return "Hoy";
    if (offset === -1) return "Ayer";
    return new Date(from).toLocaleDateString(L, { day: "numeric", month: "long" });
  }
  if (period === "week") {
    if (offset === 0) return "Esta semana";
    const f = d => new Date(d).toLocaleDateString(L, { day: "numeric", month: "short" });
    return `${f(from)} – ${f(to - 1)}`;
  }
  if (offset === 0) return "Este mes";
  const s = new Date(from).toLocaleDateString(L, { month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function exact(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = n => String(n).padStart(2, "0");
  return h > 0 ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
}
// Compacto para etiquetas chicas (gráficos, encabezado): "2h 05m", "45m", "30s".
function human(sec) {
  const hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60);
  if (hh > 0) return `${hh}h ${String(mm).padStart(2, "0")}m`;
  return mm > 0 ? `${mm}m` : `${sec}s`;
}
function hhmm(ms) { const d = new Date(ms), p = n => String(n).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}`; }

/* ====================== MINI HELPER DE DOM ====================== */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return e;
}
