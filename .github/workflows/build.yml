name: Build APK

on:
  push:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear tags y releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo para contar commits (versionCode)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Paquetes explícitos: el default de la action incluye 'tools', que Google retiró
      # del repositorio del SDK, y sdkmanager falla al no encontrarlo.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Calcular versión (número de commits)
        id: ver
        run: echo "vcode=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tests compartidos de sync (web)
        run: node tests/web.test.js

      # testDebugUnitTest primero: si la lógica de sync deja de coincidir con los casos
      # compartidos con la web (tests/fixtures), no se publica nada.
      - name: Tests + build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon -Pvcode=${{ steps.ver.outputs.vcode }} -Pvname=${{ steps.ver.outputs.vcode }}

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bitacora.apk

      # Solo main publica: un Release es lo que la app ofrece instalar en todos los
      # teléfonos, así que una rama de trabajo nunca debe generarlo. En las demás ramas
      # el build igual corre (sirve de chequeo) y la APK queda como artifact.
      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.vcode }}
          name: v${{ steps.ver.outputs.vcode }}
          files: bitacora.apk

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitacora-apk
          path: bitacora.apk
